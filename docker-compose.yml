version: '3.8'

services:
  web:
    build: .
    command: ${WEB_COMMAND:-pixi run start}
    # REMOVED VOLUMES FROM HERE
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-beetles_db}
      - POSTGRES_USER=${POSTGRES_USER:-beetles_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beetles_user} -d ${POSTGRES_DB:-beetles_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  pixi_cache:
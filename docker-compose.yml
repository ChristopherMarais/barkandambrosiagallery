version: '3.8'

services:
  web:
    build: .
    # Use variable for command (Dev uses "start", Prod uses "gunicorn")
    command: ${WEB_COMMAND:-pixi run start}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-beetles_db}
      - POSTGRES_USER=${POSTGRES_USER:-beetles_user}
      # THIS IS THE MAGIC FIX:
      # In Dev: It sees no variable, so it uses "devpass".
      # In Prod: It sees your .env.prod variable, so it uses that.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}

volumes:
  postgres_data:
  media_data:
  pixi_cache:

services:
  web:
    build: .
    volumes:
      - .:/app                # Maps your code (so you can edit files)
      - /app/.pixi            # Internal Linux environment
      - media_data:/app/media # <--- NEW: Dedicated storage for uploads
    command: ${WEB_COMMAND:-pixi run start}
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-beetles_db}
      - POSTGRES_USER=${POSTGRES_USER:-beetles_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beetles_user} -d ${POSTGRES_DB:-beetles_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"

  worker:
    build: .
    volumes:
      - .:/app                # Maps your code
      - /app/.pixi            # Internal Linux environment
      - media_data:/app/media # <--- NEW: Must match 'web' exactly
    command: pixi run celery -A beetlesgallery worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data:
  pixi_cache:
services:
  web:
    build: .
    command: pixi run start
    volumes:
      - .:/app
      - media_data:/app/media
      # Keep pixi env cached but separate
      - pixi_cache:/app/.pixi
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=beetles_db
      - POSTGRES_USER=beetles_user
      - POSTGRES_PASSWORD=devpass
    ports:
      # Expose DB to localhost so you can access it from your local machine
      - "5432:5432"

volumes:
  postgres_data:
  media_data:
  pixi_cache:

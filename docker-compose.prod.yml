services:
  web:
    build: .
    command: >
      sh -c "pixi run gunicorn beetlesgallery.wsgi:application --bind 0.0.0.0:8000 --workers 9 --timeout 120"
    restart: always
    ports:
      - "80:8000"
    volumes:
      - /opt/barkandambrosia_data/media:/app/media
    env_file:
      - .env.prod
      - .env.version
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    restart: always
    volumes:
      - /opt/barkandambrosia_data/postgres:/var/lib/postgresql/data
    env_file:
      - .env.prod
      - .env.version
    ports: []

  redis:
    image: redis:7-alpine
    restart: always

  worker:
    build: .
    restart: always
    command: pixi run celery -A beetlesgallery worker -l info --concurrency=2
    volumes:
      - /opt/barkandambrosia_data/media:/app/media
    env_file:
      - .env.prod
      - .env.version
    depends_on:
      - db
      - redis
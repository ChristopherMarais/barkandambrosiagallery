services:
  web:
    # This overrides the ${WEB_COMMAND} default
    command: pixi run gunicorn --timeout 120
    restart: always
    volumes:
      # OVERRIDE the volume mount to point to external data
      - /root/barkandambrosia_data/media:/app/media
    env_file:
      - .env.prod

  db:
    restart: always
    volumes:
      # OVERRIDE the data location
      - /root/barkandambrosia_data/postgres:/var/lib/postgresql/data
    env_file:
      - .env.prod
    # We don't need to list 'environment' here anymore!
    # The base file will automatically pick up POSTGRES_PASSWORD from .env.prod
    ports: []  # This closes the public port 5432 for security
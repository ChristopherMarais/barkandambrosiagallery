services:
  web:
    build: .
    command: >
      sh -c "pixi run gunicorn --workers 9 --timeout 600"
    restart: always
    ports:
      - "80:8000"
    volumes:
      - /opt/barkandambrosia_data/media:/app/media
    env_file:
      - .env.prod
      - .env.version
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    command: postgres -c shared_buffers=512MB -c work_mem=64MB -c effective_cache_size=2GB
    restart: always
    volumes:
      - /opt/barkandambrosia_data/postgres:/var/lib/postgresql/data
    env_file:
      - .env.prod
      - .env.version
    ports: []

  redis:
    image: redis:7-alpine
    restart: always

  worker:
    build: .
    restart: always
    # Quick background work (game re-scoring). Heavy jobs have their own worker below.
    command: pixi run celery -A beetlesgallery worker -l info --concurrency=2 -Q celery -n quick@%h
    volumes:
      - /opt/barkandambrosia_data/media:/app/media
    env_file:
      - .env.prod
      - .env.version
    depends_on:
      - db
      - redis

  worker-heavy:
    build: .
    restart: always
    # CSV uploads/updates and downloads: one at a time, at low CPU priority, so the site stays quick while they run
    command: nice -n 10 pixi run celery -A beetlesgallery worker -l info --concurrency=1 --prefetch-multiplier=1 -Q heavy -n heavy@%h
    # The same code, environment and files as the worker above gets from docker-compose.yml plus this file
    volumes:
      - .:/app
      - /app/.pixi
      - /opt/barkandambrosia_data/media:/app/media
    env_file:
      - .env
      - .env.prod
      - .env.version
    depends_on:
      - db
      - redis

{% extends 'base.html' %}
{% block content %}
<main>
  <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">
    <h2 class="text-title-md2 font-bold text-black mb-6">Sign Up</h2>

    <div class="rounded-sm border border-gray-200 bg-white shadow-default">
      <div class="w-full p-4 sm:p-12.5">
        <form method="post" action="">
          {% csrf_token %}
          
          {{ form.non_field_errors }}
          
          <div class="mb-4">
            <label class="mb-2.5 block font-medium">Username</label>
            {{ form.username }}
            {{ form.username.errors }}
          </div>
          
          <div class="mb-4">
            <label class="mb-2.5 block font-medium">Email (optional)</label>
            <input type="email" name="email" placeholder="you@example.com"
                   class="w-full rounded-lg border border-stroke bg-transparent py-4 pl-6 pr-10 outline-none
                          focus:border-primary focus-visible:shadow-none dark:border-form-strokedark
                          dark:bg-form-input dark:focus:border-primary" />
          </div>
          
          <div class="mb-4">
            <label class="mb-2.5 block font-medium">Password</label>
            {{ form.password1 }}
            {{ form.password1.errors }}
          </div>
          
          <div class="mb-6">
            <label class="mb-2.5 block font-medium">Re-type Password</label>
            {{ form.password2 }}
            {{ form.password2.errors }}
          </div>

          <div class="mb-5">
            <input type="submit" value="Create account"
              class="w-full cursor-pointer rounded-lg border border-gray-900 bg-white p-4 font-medium text-black transition hover:bg-gray-50" />
          </div>

          <div class="mt-6 text-center">
            <p class="font-medium">
              Already have an account?
              <a href="{% url 'login' %}" class="text-primary">Sign in</a>
            </p>
          </div>
        
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}

{% extends 'base.html' %}
{% load static %}
{% block content %}
<main>
  <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">
    <h2 class="text-title-md2 font-bold text-black dark mb-6">Sign In</h2>

    <div class="rounded-sm border border-stroke bg-white shadow-default dark:border-strokedark dark:bg-boxdark">
      <div class="w-full p-4 sm:p-12.5">
        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="mb-4 text-red-600">
              {{ form.non_field_errors }}
            </div>
          {% endif %}

          <!-- Username -->
          <div class="mb-4">
            <label class="mb-2.5 block font-medium text-black dark">Email or Username</label>
            <div class="relative">
              <input type="text" name="username" placeholder="Enter your email or username"
                     class="w-full rounded-lg border border-stroke bg-transparent py-4 pl-6 pr-10 outline-none
                            focus:border-primary focus-visible:shadow-none dark:border-form-strokedark
                            dark:bg-form-input dark:focus:border-primary" />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-6">
            <label class="mb-2.5 block font-medium text-black dark">Password</label>
            <div class="relative">
              <input type="password" name="password" placeholder="Enter your password"
                     class="w-full rounded-lg border border-stroke bg-transparent py-4 pl-6 pr-10 outline-none
                            focus:border-primary focus-visible:shadow-none dark:border-form-strokedark
                            dark:bg-form-input dark:focus:border-primary" />
            </div>
          </div>

          <!-- keep 'next' so Django can redirect after login if provided -->
          <input type="hidden" name="next" value="{{ next }}"/>

          <div class="mb-5">
            <input type="submit" value="Sign In"
                   class="w-full cursor-pointer rounded-lg border border-gray-900 bg-white p-4
                          font-medium text-black transition hover:bg-gray-50" />
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}

# Security updates only (no scheduled version bumps), but never a new major Tailwind: the stylesheet
# (beetlesgallery/static/css/input.css) is written for Tailwind 4, and a new major can stop the deploys' CSS build.
# Upgrading Tailwind is a deliberate change of its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

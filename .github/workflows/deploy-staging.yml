name: Deploy Staging

# The staging site (docs/staging.md): every push to main is deployed to it. Production is untouched: it still
# deploys only on a release. "Refresh data" (run by hand) also replaces staging's data with a scrubbed copy of
# production's. Nothing runs until the repository variable STAGING_ENABLED is set to true.

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Also replace the staging data with a fresh, scrubbed copy of production's"
        required: false
        default: false
        type: boolean
      deploy_modal:
        description: "Also deploy staging's own AI service (Modal), even if its code did not change"
        required: false
        default: false
        type: boolean

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging (Contabo)
    runs-on: ubuntu-latest
    if: vars.STAGING_ENABLED == 'true'
    steps:
      - name: Deploy main to the staging site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -eu
            # The staging checkout, never production's (/opt/barkandambrosiagallery)
            cd /opt/barkandambrosia_staging/app || { echo "Staging is not set up: see docs/staging.md"; exit 1; }
            git fetch origin main
            git reset --hard origin/main
            bash scripts/staging_deploy.sh
            if [ "${{ inputs.refresh_data }}" = "true" ]; then
              bash scripts/staging_refresh.sh
            fi

  # Staging's own copy of the AI service (Modal app "ibbi-api-staging"), so staging never calls the live service
  # with code it does not know yet. Deployed when a push to main changes beetlesgallery/tools/, or by hand.
  deploy-staging-modal:
    name: Deploy Staging's AI Service (Modal)
    runs-on: ubuntu-latest
    if: vars.STAGING_ENABLED == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the AI service change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "deploy=${{ inputs.deploy_modal }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- beetlesgallery/tools/; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Pixi
        if: steps.changes.outputs.deploy == 'true'
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          cache: true
          environments: default
      - name: Deploy staging's API endpoint
        if: steps.changes.outputs.deploy == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          IBBI_MODAL_APP: ibbi-api-staging
        run: pixi run modal deploy beetlesgallery/tools/modal_ibbi_api.py

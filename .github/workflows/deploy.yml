name: Deploy App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Choose what to deploy'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - modal
          - all

jobs:
  # JOB 1: Deploy Django Web App (Contabo)
  deploy-web:
    name: Deploy Web App (Contabo)
    runs-on: ubuntu-latest
    # Run on Release OR Manual (web/all)
    if: |
      github.event_name == 'release' || 
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'web' || inputs.deploy_target == 'all'))
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Stop if folder missing
            cd /opt/barkandambrosiagallery || exit 1
            
            # 1. Update Code
            git fetch --all
            git reset --hard origin/main
            
            # 2. Set Version (Fixes empty version on manual runs)
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            if [ -z "$RELEASE_TAG" ]; then
               RELEASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "manual-deploy")
            fi
            echo "APP_VERSION=$RELEASE_TAG" > .env.version

            # 3. Build Container (Do this BEFORE running pixi commands)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # 4. Install JS & Build CSS
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pixi run install-js
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pixi run build-css
            
            # 5. Collect Static (Moves CSS to where WhiteNoise finds it)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pixi run collectstatic --no-input
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pixi run migrate
            
            # 6. Restart to apply changes
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart web

            # 7. Cleanup
            docker image prune -f

  # JOB 2: Deploy AI Service (Modal)
  deploy-modal:
    name: Deploy AI Service (Modal)
    runs-on: ubuntu-latest
    # Run ONLY on Manual (modal/all)
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'modal' || inputs.deploy_target == 'all')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          cache: true
          environments: default 
      - name: Deploy API Endpoint
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: pixi run modal deploy beetlesgallery/tools/modal_ibbi_api.py
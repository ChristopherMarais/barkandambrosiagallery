name: Deploy to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/barkandambrosiagallery
            
            # 1. Get latest code
            git fetch --all
            git reset --hard origin/main
            
            # BACKUP DATABASE
            # Dumps the DB to a file named with the current timestamp inside your data folder
            # We use 'exec -T' to run the command inside the RUNNING db container
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T db pg_dump -U beetles_user beetles_db > /root/barkandambrosia_data/postgres/backup_$(date +%F_%H-%M).sql || echo "Backup failed or DB not running"

            # 2. Build and Start
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            
            # RUN MIGRATIONS
            # This applies changes to the database structure (like adding new tables)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T web pixi run migrate            
            
            # 3. Cleanup
            docker image prune -f
name: Deploy App

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Choose what to deploy'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - modal
          - all

jobs:
  # JOB 1: Deploy Django Web App (Contabo)
  deploy-web:
    name: Deploy Web App (Contabo)
    runs-on: ubuntu-latest
    # Run on Release OR Manual (web/all)
    if: |
      github.event_name == 'release' || 
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'web' || inputs.deploy_target == 'all'))
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # The live site keeps running on the old version until the new one has been built, checked and migrated.
            # Any failing step stops the deploy (set -e) before the live site is touched; a failed health check
            # after the switch puts the previous version back. Either way the job goes red, so GitHub tells you.
            set -eu
            set -o pipefail
            cd /opt/barkandambrosiagallery || exit 1
            test -f .env.prod || { echo "No .env.prod on the server: stopping"; exit 1; }

            # 1. Update code (git leaves the ignored .env, .env.prod and .env.version alone)
            git fetch --all --tags
            PREVIOUS=$(git rev-parse HEAD)
            git reset --hard origin/main
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            if [ -z "$RELEASE_TAG" ]; then
               RELEASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "manual-deploy")
            fi
            echo "APP_VERSION=$RELEASE_TAG" > .env.version

            # 2. Build the new images. The running containers are not touched yet.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build web worker worker-heavy

            # 3. Pre-flight in a throw-away container with the new code: settings load, and the database accepts
            #    the site's password (this is where a password mismatch is caught, before anything changes).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run python manage.py check --deploy --fail-level ERROR
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run python manage.py migrate --plan

            # 4. CSS, static files and the database. Migrations only ever add (see test_deploy_safety), so the
            #    old version still running keeps working on the new tables.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run install-js
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run build-css
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run collectstatic --no-input
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run migrate

            # 4b. Make sure the published interactions dataset (v1.0) is in the database, which the interactions
            # page is built from. It only adds rows that are missing and never changes one that is there, so
            # corrections made through the upload page survive every deploy.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run import-interactions
            # (The taxonomy is loaded by an admin with `manage.py migrate_taxonomy_to_db`.
            # It purges and reloads the taxonomy tables, so it is never part of a deploy.)

            # 5. Switch the site and the workers (quick jobs, and heavy uploads/downloads) to the new version
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps web worker worker-heavy

            # 6. Health check: the public home page (which reads the database) must answer 200 within two minutes.
            #    The public address, not localhost, so ALLOWED_HOSTS and the proxy in front are checked too.
            SITE=$(grep -E '^SITE_URL=' .env.prod | cut -d= -f2- | tr -d '"' || true)
            SITE=${SITE:-https://barkandambrosiagallery.org}
            healthy=0
            code=none
            for i in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/" || true)
              if [ "$code" = "200" ]; then healthy=1; break; fi
              sleep 5
            done
            if [ "$healthy" != "1" ]; then
              echo "Health check failed (last status: $code). Recent web log:"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 web || true
              echo "Rolling back to $PREVIOUS"
              git reset --hard "$PREVIOUS"
              echo "APP_VERSION=rollback-$(git rev-parse --short HEAD)" > .env.version
              docker compose -f docker-compose.yml -f docker-compose.prod.yml build web worker
              docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T web pixi run collectstatic --no-input
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps web worker
              exit 1
            fi
            echo "Deployed $RELEASE_TAG: the site answers 200"

            # 7. Cleanup
            docker image prune -f

  # JOB 2: Deploy AI Service (Modal)
  deploy-modal:
    name: Deploy AI Service (Modal)
    runs-on: ubuntu-latest
    # Run ONLY on Manual (modal/all)
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'modal' || inputs.deploy_target == 'all')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          cache: true
          environments: default 
      - name: Deploy API Endpoint
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: pixi run modal deploy beetlesgallery/tools/modal_ibbi_api.py
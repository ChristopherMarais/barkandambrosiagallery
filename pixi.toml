[workspace]
name = "beetlesgallery"
version = "0.1.0"
description = "A gallery for beetles"
authors = ["Your Name <you@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64", "linux-aarch64"]

[tasks]
# One-time setup
install-js = "npm install"

# Run this to fix broken CSS
build-css = "node node_modules/tailwindcss/lib/cli.js -i ./beetlesgallery/static/css/input.css -o ./beetlesgallery/static/css/style.css"

# Run this in a separate terminal while developing
watch-css = "node node_modules/tailwindcss/lib/cli.js -i ./beetlesgallery/static/css/input.css -o ./beetlesgallery/static/css/style.css --watch"

# Run this to start the server
start = "python manage.py runserver 0.0.0.0:8000"
migrate = "python manage.py migrate"
# Adds the published interactions dataset (v1.0) to the database if it is missing; never changes a row that is there
game-scores = "python manage.py recompute_game_scores"
remind-access = "python manage.py remind_access_requests"
backup-notice = "python manage.py backup_notice"
# Deletes expired downloads, temp leftovers and upload ZIPs whose images are already in the gallery (nightly)
cleanup-storage = "python manage.py cleanup_storage"
import-interactions = "python manage.py import_pathogen_interactions"
collectstatic = "python manage.py collectstatic --noinput"
gunicorn = "gunicorn beetlesgallery.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --worker-class gthread"


# --- Dependencies for ALL platforms (Windows, Mac, Linux) ---
[dependencies]
python = "3.11.*"
django = "5.0.*"
psycopg2 = "2.9.*"
dj-database-url = "*"
python-dotenv = "*"
pandas = "*"
openpyxl = "*"       # For reading Excel files
xlsxwriter = "*"     # For writing Excel files (downloads)
pillow = "<12.0.0"         # For ImageFields
django-crispy-forms = "*"
django-filter = "*"
django-simple-history = "*"
django-cleanup = "*"  # Optional but good for file management
djangorestframework = "*"
nodejs = "20.*"
whitenoise = ">=6.11.0,<7"
redis-py = ">=7.1.0,<8"
django-redis = "*"
celery = ">=5.5.3,<6"
python-multipart = ">=0.0.21,<0.0.22"
django-treebeard = ">=4.8.0,<5"

# --- Dependencies for LINUX/MAC ONLY (Server/Docker) ---
# Gunicorn will be installed in Docker, but ignored on your Windows laptop.
[target.linux-64.dependencies]
gunicorn = "*"

[target.osx-64.dependencies]
gunicorn = "*"

[target.osx-arm64.dependencies]
gunicorn = "*"

[pypi-dependencies]
pytailwindcss = ">=0.3.0, <0.4"
modal = ">=1.3.1, <2"
fastapi = "*"
uvicorn = "*"
requests = "*"

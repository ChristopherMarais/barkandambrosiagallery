{% load beetle_tags %}{# A player's level as a badge: an icon for the level and its number, in RPG rarity colours: grey 1-2, green 3-4, blue 5-6, purple 7-8, orange 9, glowing gold at 10. Needs ``level``; optional ``name``, ``locked`` (grey: not reached yet) and ``size`` ("lg"). #}
<span class="inline-flex items-center justify-center shrink-0 font-bold leading-none tabular-nums align-middle {% if size == 'lg' %}gap-1 px-2 rounded-lg text-sm{% else %}gap-0.5 h-5 min-w-5 px-1 rounded-md text-[10px]{% endif %}
  {% if locked %}bg-gray-100 text-gray-400 ring-1 ring-gray-200{% elif level >= 10 %}bg-yellow-400 text-yellow-950 ring-1 ring-yellow-600{% elif level >= 9 %}bg-orange-500 text-white{% elif level >= 7 %}bg-purple-600 text-white{% elif level >= 5 %}bg-blue-600 text-white{% elif level >= 3 %}bg-green-600 text-white{% else %}bg-gray-300 text-gray-800{% endif %}"
  style="{% if size == 'lg' %}height: 1.75rem; min-width: 2.25rem;{% endif %}{% if level >= 10 and not locked %} box-shadow: 0 0 {% if size == 'lg' %}12px{% else %}7px{% endif %} rgba(250,204,21,.9);{% endif %}"
  title="Level {{ level }}{% if name %}: {{ name }}{% endif %}{% if locked %} (not reached yet){% endif %}" data-testid="level-badge"><i class="fi {{ level|level_icon }} {% if size == 'lg' %}text-sm{% else %}text-[10px]{% endif %} leading-none" aria-hidden="true"></i>{{ level }}</span>

{# One taxon's two markers on the expertise tree (#498), styled in game_expertise.html by a class on each marker itself, so a taxon never takes its parent's look: a round dot for naming (Identification), a square for telling apart (Distinction). n: a node from game_trust.expertise_tree #}
<span class="tree-dot mark-{{ n.status }}" title="{% if n.status == 'expert' %}Identification expert{% else %}Identification{% endif %}" {% if n.status == 'expert' %}role="img" aria-label="Identification expert"{% else %}aria-hidden="true"{% endif %}></span><span class="tree-square mark-{{ n.apart_status }}" title="{% if n.apart_status == 'expert' %}Distinction expert{% else %}Distinction{% endif %}" {% if n.apart_status == 'expert' %}role="img" aria-label="Distinction expert"{% else %}aria-hidden="true"{% endif %}></span>

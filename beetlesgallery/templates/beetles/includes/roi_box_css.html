{# A beetle's box on a photo (#536), shared by the specimen page and the whole photo on a round's answers. Plain CSS (not Tailwind), included inside a <style> block: a white line with a darker outline, so it shows on light and dark photos; the beetle the page is about the other way round. #}
  .roi-box { position: absolute; border: 2px solid rgb(255 255 255 / 0.9); border-radius: 0.375rem;
             box-shadow: 0 0 0 1px rgb(0 0 0 / 0.4), inset 0 0 0 1px rgb(0 0 0 / 0.4); }
  .roi-box-current { cursor: default; border-color: rgb(17 24 39 / 0.9);
                     box-shadow: 0 0 0 1px rgb(255 255 255 / 0.9), inset 0 0 0 1px rgb(255 255 255 / 0.9); }

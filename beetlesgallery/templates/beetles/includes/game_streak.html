{% load beetle_tags %}{# The day streak with a flame on the site's one scale (game_scale.streak_step): grey under 3 days, red 3+, orange 7+, yellow 14+, green 30+, deep green 100+. Needs ``days``; ``alive`` dims it until today's goal is reached. #}
<span class="inline-flex items-center gap-1.5 font-semibold scale-{{ days|streak_scale }}{% if not alive %} opacity-60{% endif %}" data-testid="streak">
  <i class="fi fi-rr-flame"></i><span class="text-gray-900">{{ days|digit_groups }} day streak</span>
</span>
